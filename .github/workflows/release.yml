name: Release

# Publishes new extension versions after they reach main: builds them from
# the merged commit (never from a pull request's artifacts), releases the
# packages, and updates the signed Gallery index on the gh-pages branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gallery-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # Secrets live in this environment; require a maintainer's approval there.
    environment: gallery
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the published site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add --detach site origin/gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq .
          fi

      - name: Import the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in the certificate." >&2; exit 1; }
          echo "DEVELOPER_ID_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Publish new versions
        env:
          PRISM_GALLERY_SIGNING_KEY: ${{ secrets.GALLERY_SIGNING_KEY }}
          PRISM_GALLERY_KEY_ID: ${{ vars.GALLERY_KEY_ID }}
        run: bash tools/release.sh --site site

      - name: Push the site
        run: |
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "The site is unchanged."
          else
            git -C site commit -qm "Publish ${GITHUB_SHA::7}"
            git -C site push origin HEAD:gh-pages
          fi
